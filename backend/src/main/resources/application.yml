server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: larder-api
  datasource:
    # 连接串只从环境变量来，不在仓库里写死主机/密码（docs/06 §3）
    url: jdbc:mysql://${LARDER_DB_HOST:127.0.0.1}:${LARDER_DB_PORT:3306}/${LARDER_DB_NAME:larder}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&rewriteBatchedStatements=true
    username: ${LARDER_DB_USER:larder}
    password: ${LARDER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${LARDER_DB_POOL_SIZE:8}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.larder: INFO
    org.flywaydb: INFO
