server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
  shutdown: graceful

spring:
  application:
    name: larder-api
  datasource:
    # 连接串只从环境变量来，不在仓库里写死主机/密码（docs/06 §3）
    url: jdbc:mysql://${LARDER_DB_HOST:127.0.0.1}:${LARDER_DB_PORT:3306}/${LARDER_DB_NAME:larder}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&rewriteBatchedStatements=true
    username: ${LARDER_DB_USER:larder}
    password: ${LARDER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${LARDER_DB_POOL_SIZE:8}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.larder: INFO
    org.flywaydb: INFO

larder:
  identity:
    # 单管理员：只允许环境变量注入，仓库里不放任何默认密码
    username: ${LARDER_ADMIN_USERNAME:admin}
    password: ${LARDER_ADMIN_PASSWORD:}
    password-hash: ${LARDER_ADMIN_PASSWORD_HASH:}

  storage:
    # S3 兼容端点；容器内指向 minio 服务，本机调试指向 127.0.0.1:9000
    endpoint: ${LARDER_S3_ENDPOINT:http://127.0.0.1:9000}
    region: ${LARDER_S3_REGION:us-east-1}
    bucket: ${LARDER_S3_BUCKET:larder-artifacts}
    access-key: ${LARDER_S3_ACCESS_KEY:}
    secret-key: ${LARDER_S3_SECRET_KEY:}
    max-bytes: ${LARDER_ARTIFACT_MAX_BYTES:20971520}
    # 对象已写、元数据落库失败时的孤立对象清单（挂卷持久化）
    orphan-file: ${LARDER_ORPHAN_FILE:/var/lib/larder/orphans.jsonl}

  outbox:
    # 默认关闭：单机开发不必起 RabbitMQ；验证投递时用环境变量打开
    enabled: ${LARDER_OUTBOX_ENABLED:false}
    relay-id: ${LARDER_OUTBOX_RELAY_ID:relay-local}
    batch-size: ${LARDER_OUTBOX_BATCH:20}
    lease-seconds: ${LARDER_OUTBOX_LEASE_SECONDS:30}
    max-attempts: ${LARDER_OUTBOX_MAX_ATTEMPTS:5}
    poll-interval-ms: ${LARDER_OUTBOX_POLL_MS:1000}
    confirm-timeout-ms: ${LARDER_OUTBOX_CONFIRM_TIMEOUT_MS:5000}

  inbox:
    # 消费去重命名空间；多实例共享同一 consumer 名才能互斥去重
    consumer: ${LARDER_INBOX_CONSUMER:ingest-consumer}
    worker-id: ${LARDER_INBOX_WORKER_ID:worker-local}
    lease-seconds: ${LARDER_INBOX_LEASE_SECONDS:120}
    prefetch: ${LARDER_INBOX_PREFETCH:5}
