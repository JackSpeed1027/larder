# S06 隔离故障注入覆盖：独立 project + 独立端口 + 独立卷（project 前缀）。
# 用法（必须带 -p larder-it，避免碰到开发栈）：
#   docker compose -p larder-it -f compose.yaml -f compose.dev.yaml -f compose.isolated.yaml up -d --wait
services:
  mysql:
    ports: !override
      - "13306:3306"
  rabbitmq:
    ports: !override
      - "25672:5672"
      - "25673:15672"
  minio:
    ports: !override
      - "19000:9000"
      - "19001:9001"
  api:
    ports: !override
      - "18081:8080"
  web:
    ports: !override
      - "18080:80"

  runner:
    ports: !override
      - "18000:8000"
