spring:
  application:
    name: larder-version-compat-check
  main:
    banner-mode: off
  datasource:
    # 仅验证脚手架：真实部署用 MySQL 8.4，见 docs/versions.lock.json
    url: jdbc:h2:mem:compat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: WARN
    org.flywaydb: INFO
